[project]
name = "langchainupdate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sujalbhatt1718", email = "sujalbhatt1718@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "create-agent>=0.0.3",
    "dotenv>=0.9.9",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.4",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-tools>=0.1.34",
    "langgraph>=1.2.12",
    "library>=3.2.6",
    "python-dotenv>=1.2.3",
]

[project.scripts]
langchainupdate = "langchainupdate:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
